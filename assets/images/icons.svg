<?xml version="1.0"?>
<!-- Иконка плагина для спрайта Redmine: пункт «Схема» в верхнем меню.
     Формат как у ядра (app/assets/images/icons.svg Redmine 6/7): символ
     с id «icon» + имя, viewBox 24x24, пути без собственных стилей,
     stroke/fill задаёт CSS ядра (svg.icon-svg). Пайплайн отдаёт файл как
     plugin_assets/redmine_work_scheme/icons.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" class="icon--sprite">
  <defs>
    <symbol viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" id="icon--work-scheme">
      <circle cx="4.5" cy="12" r="2"/>
      <path d="M6.5 12h3"/>
      <rect x="9.5" y="9" width="6.5" height="6" rx="1.5"/>
      <path d="M16 12h2.5"/>
      <path d="m19 9.5 2.5 2.5-2.5 2.5"/>
    </symbol>
  </defs>
</svg>
