<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Work Scheme preview (dev)</title>
<link rel="stylesheet" href="../assets/stylesheets/work_scheme.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; max-width: 1100px; }
</style>
</head>
<body>
<h2>Схема (dev-превью)</h2>
<div class="ws-container" data-work-scheme data-stage-base-url="/work_scheme/stages/" data-more-label="Подробнее">
  <script type="application/json" class="ws-data"></script>
</div>
<script src="../assets/javascripts/work_scheme.js"></script>
<script>
  // dev-обвязка: подтягиваем схему из scheme.json и инициализируем рендерер
  fetch('scheme.json')
    .then(function (r) { return r.text(); })
    .then(function (text) {
      document.querySelector('script.ws-data').textContent = text;
      window.WorkScheme.init();
    })
    .catch(function (e) { document.body.appendChild(document.createTextNode('load error: ' + e)); });
</script>
</body>
</html>
