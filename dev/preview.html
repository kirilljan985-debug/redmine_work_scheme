<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Work Scheme preview (dev)</title>
<link rel="stylesheet" href="../assets/stylesheets/work_scheme.css?v=100">
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; max-width: 1100px; background: #dbe7fb; color: #14245c; }
</style>
</head>
<body>
<h2>Схема (dev-превью)</h2>
<div class="ws-container" data-work-scheme data-layout="modern"
     data-stage-base-url="/work_scheme/stages/"
     data-counts-url="counts.json"
     data-query-base-url="/issues"
     data-edit-url="/work_scheme/edit"
     data-label-play="Проиграть" data-label-reset="Сброс"
     data-label-edit-page="Редактор схемы"
     data-label-playback-step="Этап" data-label-playback-done="Готово"
     data-label-no-scenarios="Сценарии проигрывания пока не добавлены."
     data-label-tasks="Задач" data-label-progress="Прогресс сценария"
     data-label-speed="Скорость"
     data-label-zoom-out="Уменьшить" data-label-zoom-in="Увеличить" data-label-zoom-fit="Вписать в блок"
     data-more-label="Подробнее">
  <script type="application/json" class="ws-data"></script>
</div>
<script src="../assets/javascripts/work_scheme.js?v=100"></script>
<script>
  // dev-обвязка: схема из scheme.json + демо-стрелка elbow + демо query_id; инициализация
  fetch('scheme.json?v=100')
    .then(function (r) { return r.text(); })
    .then(function (text) {
      var scheme = JSON.parse(text);
      // демонстрация elbow-маршрута и явных сторон (только в dev-превью)
      scheme.edges.push({
        from: 'check', to: 'cert', label: 'пример elbow',
        route: 'elbow', from_side: 'bottom', to_side: 'right', dashed: true
      });
      // демонстрация живых счётчиков: id совпадают с dev/counts.json
      scheme.nodes[0].query_id = 1;
      scheme.nodes[scheme.nodes.length - 1].query_id = 2;
      document.querySelector('script.ws-data').textContent = JSON.stringify(scheme);
      window.WorkScheme.init();
    })
    .catch(function (e) { document.body.appendChild(document.createTextNode('load error: ' + e)); });
</script>
</body>
</html>
