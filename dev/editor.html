<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Work Scheme editor preview (dev)</title>
<link rel="stylesheet" href="../assets/stylesheets/work_scheme.css?v=6">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
</style>
</head>
<body>
<h2>Редактор схемы (dev-превью)</h2>
<div id="ws-editor" data-save-url=""
     data-more-label="Подробнее" data-label-save="Сохранить схему" data-label-saved="Схема сохранена"
     data-label-download="Скачать JSON" data-label-add-node="Добавить узел" data-label-add-edge="Добавить стрелку"
     data-label-add-edge-hint="Кликните исходный узел, затем целевой" data-label-swap="Развернуть"
     data-label-delete="Удалить" data-label-node="Узел" data-label-edge="Стрелка"
     data-label-scenarios="Сценарии проигрывания" data-label-steps-hint="id узлов через запятую"
     data-label-bend="Изгиб">
  <div class="ws-editor-main">
    <div class="ws-container" data-work-scheme>
      <script type="application/json" class="ws-data"></script>
    </div>
  </div>
  <div class="ws-editor-side">
    <div id="ws-obj-panel"><em>Узел / Стрелка</em></div>
    <div class="ws-editor-actions">
      <button type="button" id="ws-add-node" class="button"></button>
      <button type="button" id="ws-add-edge"></button>
    </div>
    <div class="ws-scenarios-block">
      <h4>Сценарии проигрывания</h4>
      <div id="ws-scenarios-list"></div>
      <button type="button" id="ws-add-scenario">+ Сценарии</button>
    </div>
    <div class="ws-editor-actions">
      <button type="button" id="ws-save" class="button"></button>
      <button type="button" id="ws-download"></button>
    </div>
    <div id="ws-save-status"></div>
  </div>
</div>
<script src="../assets/javascripts/work_scheme.js?v=6"></script>
<script src="../assets/javascripts/work_scheme_editor.js?v=6"></script>
<script>
  // dev-обвязка: после загрузки схемы повторно инициируем редактор
  // (editor.js вешает init на DOMContentLoaded, который к моменту fetch уже прошёл)
  fetch('scheme.json')
    .then(function (r) { return r.text(); })
    .then(function (text) {
      document.querySelector('script.ws-data').textContent = text;
      document.dispatchEvent(new Event('DOMContentLoaded'));
    })
    .catch(function (e) { document.body.appendChild(document.createTextNode('load error: ' + e)); });
</script>
</body>
</html>
