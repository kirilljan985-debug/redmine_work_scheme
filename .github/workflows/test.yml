name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-smoke:
    # Рантайм-JS: инициализация рендерера и редактора в jsdom (проигрывание,
    # undo, сериализация, уникальные id сценариев). Раньше рантайм не
    # проверялся ничем, кроме node --check, — регресс уходил в main зелёным.
    name: JS smoke (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: test/js/package-lock.json

      - name: Syntax check JS
        run: |
          node --check assets/javascripts/work_scheme.js
          node --check assets/javascripts/work_scheme_editor.js

      - name: Install jsdom
        run: npm ci
        working-directory: test/js

      - name: Run DOM smoke
        run: node smoke_test.js
        working-directory: test/js

  redmine:
    name: Redmine ${{ matrix.redmine }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        redmine: ['7.0-stable', 'master']
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Syntax check JS
        run: |
          node --check plugin/assets/javascripts/work_scheme.js
          node --check plugin/assets/javascripts/work_scheme_editor.js

      - name: Install Redmine (${{ matrix.redmine }})
        run: |
          git clone --depth 1 --branch ${{ matrix.redmine }} https://github.com/redmine/redmine.git redmine
          mv plugin redmine/plugins/redmine_work_scheme
          cp redmine/plugins/redmine_work_scheme/.github/ci/database.yml redmine/config/database.yml

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: redmine

      - name: Bundle install
        run: bundle install --jobs 4 --retry 3
        working-directory: redmine

      - name: Prepare test database
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:migrate RAILS_ENV=test
        working-directory: redmine

      - name: Eager-load smoke check (как production)
        run: RAILS_ENV=test bundle exec rails runner 'Rails.application.eager_load!; puts :EAGER_OK'
        working-directory: redmine

      - name: Run plugin tests
        run: |
          set -o pipefail
          bundle exec rake redmine:plugins:test NAME=redmine_work_scheme RAILS_ENV=test 2>&1 | tee /tmp/test_output.log
        working-directory: redmine

      - name: Report failure details
        if: failure()
        run: |
          [ -f /tmp/test_output.log ] || exit 0
          echo "::error::$(python3 -c "import urllib.parse; data = open('/tmp/test_output.log', 'rb').read()[-4000:].decode('utf-8', 'replace'); print(urllib.parse.quote(data)[:6000])")"

  legacy-additionals:
    # Легаси-поколение API additionals (4.0–4.6: блок через патч
    # DashboardContent, класса DashboardBlocks::Base нет). Ветка исполняется
    # только здесь — обычная джоба additionals гоняет main (4.7+).
    # additionals 4.6.0 требует Redmine >= 7.0 и не работает под sqlite.
    name: Redmine 7.0-stable + additionals 4.6 (legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redmine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Syntax check JS
        run: |
          node --check plugin/assets/javascripts/work_scheme.js
          node --check plugin/assets/javascripts/work_scheme_editor.js

      - name: Install Redmine and additionals 4.6.0
        run: |
          git clone --depth 1 --branch 7.0-stable https://github.com/redmine/redmine.git redmine
          git clone --depth 1 --branch 4.6.0 https://github.com/alphanodes/additionals.git redmine/plugins/additionals
          mv plugin redmine/plugins/redmine_work_scheme
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          cp redmine/plugins/redmine_work_scheme/.github/ci/database-additionals.yml redmine/config/database.yml

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: redmine

      - name: Bundle install
        run: bundle install --jobs 4 --retry 3
        working-directory: redmine

      - name: Prepare test database
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:create db:migrate RAILS_ENV=test
          # миграции плагинов (additionals 4.6): таблицы дашбордов
          bundle exec rake redmine:plugins:migrate RAILS_ENV=test
        working-directory: redmine

      - name: Eager-load smoke check (как production)
        run: RAILS_ENV=test bundle exec rails runner 'Rails.application.eager_load!; puts :EAGER_OK'
        working-directory: redmine

      - name: Run plugin tests
        run: |
          set -o pipefail
          bundle exec rake redmine:plugins:test NAME=redmine_work_scheme RAILS_ENV=test 2>&1 | tee /tmp/test_output.log
        working-directory: redmine

      - name: Report failure details
        if: failure()
        run: |
          [ -f /tmp/test_output.log ] || exit 0
          echo "::error::$(python3 -c "import urllib.parse; data = open('/tmp/test_output.log', 'rb').read()[-4000:].decode('utf-8', 'replace'); print(urllib.parse.quote(data)[:6000])")"

  additionals:
    # Ветка интеграции с additionals не выполняется в обычной матрице (там ядро
    # без плагинов), поэтому гоняем её отдельно на PostgreSQL (additionals >= 4.7
    # не работает под sqlite) — по разделу 4 скилла redmine-plugin-dev.
    # Релизных тегов 4.7 у additionals нет (последний тег — 4.6.0, main = 4.7.0-main):
    # джоба сознательно следит за плавающим main как канарейкой линии 4.7+.
    name: Redmine 7.0-stable + additionals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redmine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Syntax check JS
        run: |
          node --check plugin/assets/javascripts/work_scheme.js
          node --check plugin/assets/javascripts/work_scheme_editor.js

      - name: Install Redmine and additionals
        run: |
          git clone --depth 1 --branch 7.0-stable https://github.com/redmine/redmine.git redmine
          git clone --depth 1 https://github.com/alphanodes/additionals.git redmine/plugins/additionals
          mv plugin redmine/plugins/redmine_work_scheme
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          cp redmine/plugins/redmine_work_scheme/.github/ci/database-additionals.yml redmine/config/database.yml

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: redmine

      - name: Bundle install
        run: bundle install --jobs 4 --retry 3
        working-directory: redmine

      - name: Prepare test database
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:create db:migrate RAILS_ENV=test
          # миграции плагинов (additionals): таблицы дашбордов нужны будущим
          # тестам рендера блока
          bundle exec rake redmine:plugins:migrate RAILS_ENV=test
        working-directory: redmine

      - name: Eager-load smoke check (как production)
        run: RAILS_ENV=test bundle exec rails runner 'Rails.application.eager_load!; puts :EAGER_OK'
        working-directory: redmine

      - name: Run plugin tests
        run: |
          set -o pipefail
          bundle exec rake redmine:plugins:test NAME=redmine_work_scheme RAILS_ENV=test 2>&1 | tee /tmp/test_output.log
        working-directory: redmine

      - name: Report failure details
        if: failure()
        run: |
          [ -f /tmp/test_output.log ] || exit 0
          echo "::error::$(python3 -c "import urllib.parse; data = open('/tmp/test_output.log', 'rb').read()[-4000:].decode('utf-8', 'replace'); print(urllib.parse.quote(data)[:6000])")"
